services:
  db:
    image: postgres:16-alpine
    container_name: mf_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mf_password}
      POSTGRES_DB: ${POSTGRES_DB:-mf_maintenance}
    volumes:
      - mf_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mf_user} -d ${POSTGRES_DB:-mf_maintenance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mf_backend_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - mf_attachments:/app/storage/attachments
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

volumes:
  mf_pgdata:
  mf_attachments:
